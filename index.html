<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The One. . . .Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="matrixWallpaper" aria-hidden="true"></canvas>
    <div id="matrixOverlay" aria-hidden="true"></div>
    <section id="introScreen" aria-label="Enter your first name">
        <form id="nameForm" autocomplete="off">
            <label class="visually-hidden" for="firstNameInput">First name</label>
            <input type="text" id="firstNameInput" name="firstName" placeholder="First name." autocomplete="given-name" spellcheck="false">
        </form>
    </section>
    <button type="button" id="skipSequenceButton" class="skip-sequence is-hidden">Skip</button>
    <button type="button" id="redPillButton" class="pill-easter-egg red-pill" aria-label="Red pill"></button>
    <button type="button" id="bluePillButton" class="pill-easter-egg blue-pill" aria-label="Blue pill"></button>
    <main id="computerContainer" class="is-hidden" aria-label="The Calculator terminal">
        <section id="computerScreen">
            <div id="transcript" aria-live="polite"></div>
            <form id="promptForm" class="is-hidden" autocomplete="off">
                <span id="promptCaret" aria-hidden="true">&gt;</span>
                <label class="visually-hidden" for="calculatorInput">Type a calculation</label>
                <input type="text" id="calculatorInput" inputmode="text" autocomplete="off" spellcheck="false" disabled>
            </form>
            <section id="matrixGame" class="matrix-game is-hidden" aria-label="Red pill game" tabindex="-1">
                <canvas id="matrixGameCanvas" aria-label="Neo side scrolling through the Matrix"></canvas>
                <button type="button" id="quitGameButton" class="game-quit">Quit</button>
                <div id="gameOverlay" class="game-overlay is-hidden">
                    <p id="gameMessage"></p>
                    <div class="game-actions">
                        <button type="button" id="playAgainButton">Play Again</button>
                        <button type="button" id="calculatorButton">Calculator</button>
                    </div>
                </div>
            </section>
        </section>
    </main>
    <audio id="gameMusic" src="assets/neon-rainfall.mp3" preload="none" loop></audio>
    <script src="script.js"></script>
</body>
</html>
